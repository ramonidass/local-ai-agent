# News sources. Europe first, then the US, then major world news; tech and space on top.
# Each feed's host must also be in egress-proxy/squid.conf (tests/test_fetch.py checks this).
# region and topic place a feed on the News tab; outlet joins an outlet's feeds (default: the name).
# The order matters: when several outlets cover a story, the first one listed gives the headline.
# Ownership in brackets, for balance:
# public broadcasters first, then papers and sites with a known lean.

feeds:
  # Europe
  - {name: BBC Europe, outlet: BBC,      region: Europe, topic: Politics, url: "https://feeds.bbci.co.uk/news/world/europe/rss.xml"}  # UK public
  - {name: BBC UK Politics, outlet: BBC, region: Europe, topic: Politics, url: "https://feeds.bbci.co.uk/news/politics/rss.xml"}
  - {name: DW,              region: Europe, topic: World,    url: "https://rss.dw.com/xml/rss-en-all"}                    # German public
  - {name: France 24 Europe, outlet: France 24, region: Europe, topic: Politics, url: "https://www.france24.com/en/europe/rss"}            # French public
  - {name: Euronews,        region: Europe, topic: World,    url: "https://www.euronews.com/rss"}
  - {name: Politico Europe, region: Europe, topic: Politics, url: "https://www.politico.eu/feed/"}
  - {name: Guardian Europe, outlet: The Guardian, region: Europe, topic: Politics, url: "https://www.theguardian.com/world/europe-news/rss"}  # centre-left
  # US
  - {name: BBC US, outlet: BBC,          region: US,     topic: Politics, url: "https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml"}
  - {name: NPR Politics, outlet: NPR,    region: US,     topic: Politics, url: "https://feeds.npr.org/1014/rss.xml"}                   # US public, centre-left
  - {name: Fox Politics, outlet: Fox News,    region: US,     topic: Politics, url: "https://moxie.foxnews.com/google-publisher/politics.xml"}  # right
  # World and business
  - {name: BBC World, outlet: BBC,       region: World,  topic: World,    url: "https://feeds.bbci.co.uk/news/world/rss.xml"}
  - {name: BBC Business, outlet: BBC,    region: World,  topic: Business, url: "https://feeds.bbci.co.uk/news/business/rss.xml"}
  # Tech and space
  - {name: BBC Technology, outlet: BBC,  region: World,  topic: Tech,     url: "https://feeds.bbci.co.uk/news/technology/rss.xml"}
  - {name: Ars Technica,    region: World,  topic: Tech,     url: "https://feeds.arstechnica.com/arstechnica/index"}
  - {name: Sifted,          region: Europe, topic: Tech,     url: "https://sifted.eu/feed"}                         # European tech and startups
  - {name: SpaceNews,       region: World,  topic: Space,    url: "https://spacenews.com/feed/"}

# Topics tag each story on the News tab (news.py; no network, no model). A story is in a topic when
# one of its headlines has an include keyword and no exclude keyword; it can be in several or none.
# Case and plurals don't matter ("tariffs" = "Tariff"); words match whole ("war" is not in "award").
# A keyword of several words is a phrase: next to each other, in order, small words included, so
# "Bank of England" is not in "England's banks". A short word in capitals matches only as written:
# "US" is in "US troops" but not in "tell us", "AI" not in "Ai Weiwei". "U.S." matches "U.S.".
# feeds: (optional) puts every story from those feeds (names as above) in the topic, keywords or not:
# the specialist feeds, since the tab's sections are regions only (Europe, US, World).
# A topics: block news.py can't read stops the run with a message.
topics:
  Politics:
    include: [election, parliament, prime minister, chancellor, president, government, minister,
              European Commission, EU, G7, White House, Congress, Senate, Supreme Court, Kremlin,
              NATO, sanctions, tariffs, referendum, coalition, Democrats, Republicans, GOP, Labour,
              Tory, Tories]
    exclude: [football, cricket, rugby, Eurovision, Oscars]
  Tech and AI:
    include: [AI, artificial intelligence, OpenAI, ChatGPT, chatbot, Anthropic, Nvidia, semiconductor,
              chips, 5G, cybersecurity, hackers, ransomware, data breach, antitrust, smartphone, iPhone,
              Google, Microsoft, software, startup, robot, quantum computing, deepfake]
    exclude: [fish, blue chip]                 # fish and chips, blue-chip stocks
    feeds: [BBC Technology, Ars Technica, Sifted]
  Space:
    include: [SpaceX, NASA, European Space Agency, ESA, rocket, satellite, astronaut, spacecraft,
              space station, spacewalk, telescope, asteroid, lunar, moon, Mars, orbit, Starship,
              Blue Origin, Artemis]
    exclude: [missile, rocket attack, rocket fire, rockets fired, Bruno, Mars bar]   # wars; the singer
    feeds: [SpaceNews]
  Economy:
    include: [economy, economic, inflation, recession, GDP, interest rates, central bank,
              Federal Reserve, Fed chair, Fed officials, Fed rate, Bank of England, ECB, unemployment,
              jobs report, wages, cost of living, rate cut, rate hike, mortgage, stock market,
              Wall Street, FTSE, bond yields, tariffs, trade war, trade deal]    # "Fed" alone: "fed up"
    exclude: [economy class, football]
    feeds: [BBC Business]
  War and security:
    include: [war, wars, Ukraine, Ukrainian, Zelensky, Putin, Russian attack, Russian strike,
              Russian drone, Gaza, Israel, Hamas, Hezbollah, West Bank, Houthi, NATO, missile,
              drone strike, drone attack, airstrike, air strike, rocket attack, rocket fire, shelling,
              ceasefire, truce, invasion, troops, soldiers, military, army, Pentagon, defence minister,
              defence secretary, defence spending, Ministry of Defence, Security Council,
              national security, nuclear weapons, hostages, terror attack, terrorism, terrorist]
    exclude: [price war, bidding war, trade war, culture war, culture wars, Star Wars, war of words,
              Salvation Army, Eurovision]
  Disasters and climate:
    include: [flood, flooding, flash floods, storm, tropical storm, hurricane, typhoon, cyclone, tornado,
              wildfire, bushfire, forest fire, earthquake, quake, aftershock, tsunami, volcano,
              landslide, avalanche, heatwave, heat wave, drought, extreme weather, weather warning,
              climate change, climate crisis, global warming, climate summit, COP30, net zero,
              carbon emissions]
    # figurative: "flood of complaints", "storm of criticism", "protesters storm the", "wins by a landslide"
    exclude: [flood of, flood the zone, flooding the zone, political storm, storm of, media storm,
              perfect storm, storm out, storms out, storm the, protesters storm, landslide victory,
              landslide win, by a landslide, election landslide, avalanche of, Carolina Hurricanes]

# Candidates: the day's shortlist in news.json, beside the sections (which keep their own limit).
# Stories with a topic by keyword, and stories no_topic_outlets or more outlets cover, topic or not
# (3 tried on 2026-11-16: the same keeps, two more drops, so 2). A topic that
# comes only from a topic's feeds: above isn't enough (those feeds also carry consumer tips and
# features). Best first by score (on each candidate): weights.outlets per outlet covering the story,
# plus weights.fresh x freshness (1 at fetch time, 0 at 36 hours old), plus sections: for a story
# in that section. With outlets 1 and fresh under 1, one more outlet beats any age and the same
# outlets go newest first; Europe 0.25 with fresh 0.5 counts a European story as 18 hours newer.
# A tie goes to the newer, then the link. per_outlet spreads the outlets: only that many stories led
# by one outlet (it gives the headline: the first listed above) come in score order; the ones over
# it fill any room left at the end, also in score order.
# Check a change against hand labels with news.py --eval-top (see its --help).
candidates:
  max: 40
  per_outlet: 8
  no_topic_outlets: 2
  weights: {outlets: 1, fresh: 0.5}
  sections: {Europe: 0.25}


# GDELT counts coverage across thousands of outlets: good for "what is everyone writing about".
# Off for now (2026-11-10): it answered 429 "one request every 5 seconds" even to a first request,
# probably because of a shared VPN address. Remove the # signs to
# try again; the job skips it while this is commented out.
# Queries use GDELT's syntax: OR only inside brackets, phrases in quotes, words of 3+ letters.
# gdelt:
