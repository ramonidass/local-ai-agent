# Allowlist proxy: the mail bridge may reach Proton's servers and nothing else; the news-fetch
# job (alone on fetch.network, 10.89.250.0/24) may reach the Markets and News hosts and nothing else.
http_port 3128
acl proton dstdomain .proton.me .protonmail.ch .protonmail.com
acl fetch_net src 10.89.250.0/24
# Markets: daily closes (Tiingo), earnings and company news (Finnhub), release dates (FRED).
acl fetch_hosts dstdomain api.tiingo.com finnhub.io api.stlouisfed.org
# News: GDELT, Hacker News, and every feed host in state-feeds/news.yaml (tests/test_fetch.py checks).
acl fetch_hosts dstdomain api.gdeltproject.org hacker-news.firebaseio.com
acl fetch_hosts dstdomain feeds.bbci.co.uk rss.dw.com www.france24.com www.euronews.com
acl fetch_hosts dstdomain www.politico.eu www.theguardian.com feeds.npr.org moxie.foxnews.com
acl fetch_hosts dstdomain feeds.arstechnica.com sifted.eu spacenews.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT fetch_net fetch_hosts
http_access allow CONNECT proton !fetch_net
http_access deny all
# No caching, no forwarding headers, logs to stdout for `podman logs`
cache deny all
forwarded_for delete
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
pid_filename none
pinger_enable off
# Squid's own DNS servers, tried in order, instead of Podman's forwarder (which only uses the
# host's first one). If the host runs a VPN that refuses DNS to other servers, put its DNS first.
dns_nameservers 192.168.8.1
